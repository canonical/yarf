name: Setup Noble environment
description: Install base apt deps, set up Python 3.12 and uv. Caller must run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Install base dependencies
      shell: bash
      run: ./.github/scripts/yarf/install-base-deps.sh

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - name: Install uv
      shell: bash
      run: pip install uv
