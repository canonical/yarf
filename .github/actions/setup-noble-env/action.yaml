name: Setup Noble environment
description: Install base apt deps, set up Python 3.12 and uv. Caller must run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Install base dependencies
      shell: bash
      run: ./.github/scripts/yarf/install-base-deps.sh

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"

    - name: Install uv
      shell: bash
      run: pip install uv
