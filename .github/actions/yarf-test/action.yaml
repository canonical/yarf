name: YARF test
description: >-
  Run YARF visual tests in CI. Installs dependencies, starts a platform
  (built-in Mir/Vnc or a custom provider), launches the app under test,
  runs YARF against a test suite and surfaces the results as an artifact and
  job summary, failing the job when tests fail. Caller must run
  actions/checkout first.

inputs:
  platform:
    description: Value passed to `yarf --platform`.
    required: true
  platform-provider:
    description: "Platform YARF starts with: Mir, Vnc, or custom."
    required: false
    default: Mir
  platform-setup-command:
    description: Command(s) to start the platform when platform-provider is custom.
    required: false
    default: ""
  platform-ready-command:
    description: Command(s) that block until a custom platform is ready.
    required: false
    default: ""
  platform-teardown-command:
    description: Command(s) to tear down a custom platform after the run.
    required: false
    default: ""
  test-path:
    description: Path (in the consumer's checkout) to the YARF test suite to run.
    required: true
  launch-command:
    description: >-
      Command the action runs to start the app/OS under test on the platform,
      just before running YARF. Skipped when empty.
    required: false
    default: ""
  yarf-channel:
    description: Snap channel to install YARF from when yarf-ref is unset.
    required: false
    default: latest/stable
  yarf-ref:
    description: Git ref (branch/tag/SHA) to build and install YARF from source.
    required: false
    default: ""
  yarf-args:
    description: Extra yarf options placed before the test path (e.g. --output-format).
    required: false
    default: ""
  robotframework-args:
    description: Extra args appended after `--` to the yarf invocation (e.g. --suite foo).
    required: false
    default: ""
  display-size:
    description: Virtual output resolution for the built-in platforms.
    required: false
    default: 1280x1024
  artifact-name:
    description: Name for the uploaded results artifact.
    required: false
    default: yarf-output
  upload-artifact:
    description: Whether to upload the YARF output dir as an artifact.
    required: false
    default: "true"

outputs:
  output-dir:
    description: Absolute path to YARF's output directory.
    value: ${{ steps.run.outputs.output-dir }}
  result:
    description: passed or failed.
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Install workflow dependencies
      shell: bash
      env:
        PLATFORM_PROVIDER: ${{ inputs.platform-provider }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install-deps.sh"

    - name: Install YARF
      shell: bash
      env:
        YARF_REF: ${{ inputs.yarf-ref }}
        YARF_CHANNEL: ${{ inputs.yarf-channel }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install-yarf.sh"

    - name: Start platform
      shell: bash
      env:
        PLATFORM_PROVIDER: ${{ inputs.platform-provider }}
        DISPLAY_SIZE: ${{ inputs.display-size }}
        PLATFORM_SETUP_COMMAND: ${{ inputs.platform-setup-command }}
        PLATFORM_READY_COMMAND: ${{ inputs.platform-ready-command }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/start-platform.sh"

    - name: Launch app under test
      if: inputs.launch-command != ''
      shell: bash
      env:
        LAUNCH_COMMAND: ${{ inputs.launch-command }}
      run: |
        set -euo pipefail
        bash -c "${LAUNCH_COMMAND}" &
        echo "YARF_APP_PID=$!" >> "${GITHUB_ENV}"

    - name: Run YARF
      id: run
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        TEST_PATH: ${{ inputs.test-path }}
        YARF_ARGS: ${{ inputs.yarf-args }}
        ROBOTFRAMEWORK_ARGS: ${{ inputs.robotframework-args }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run-yarf.sh"

    - name: Tear down platform
      if: always() && inputs.platform-provider == 'custom' && inputs.platform-teardown-command != ''
      shell: bash
      env:
        PLATFORM_TEARDOWN_COMMAND: ${{ inputs.platform-teardown-command }}
      run: bash -c "${PLATFORM_TEARDOWN_COMMAND}"

    - name: Upload YARF output
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.output-dir }}
        if-no-files-found: warn

    - name: Job summary
      if: always()
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        RESULT: ${{ steps.run.outputs.result }}
        OUTPUT_DIR: ${{ steps.run.outputs.output-dir }}
      run: |
        {
          echo "### YARF test result"
          echo ""
          echo "- Platform: \`${PLATFORM}\`"
          echo "- Result: \`${RESULT:-unknown}\`"
          echo "- Output dir: \`${OUTPUT_DIR:-unknown}\`"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Propagate result
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "${EXIT_CODE:-1}"
