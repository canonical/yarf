name: Testing and quality control for YARF codebase

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!snap/**'
      - '!.github/workflows/*'
      - '.github/workflows/yarf.yaml'

permissions:
  contents: read  # Required to check out repository code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-jammy:
    name: Jammy - Install and sync
    runs-on: [self-hosted, linux, jammy, x64, large]
    steps:
    - name: Install dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y \
          git-lfs \
          libgl1 \
          libxkbcommon-dev \
          jq \
          clang \
          python3-tk

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: true
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.10"
    - name: Install uv
      run: pip install uv
    - name: Sync Python dependencies
      run: uv sync --python 3.10

  install-noble:
    name: Noble - Install and sync
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-noble-env

    - name: Sync Python dependencies
      run: uv sync --python 3.12

  unit-tests-noble:
    name: Noble - Unit tests
    runs-on: ubuntu-24.04
    needs: install-noble
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: true
        fetch-depth: 0
        persist-credentials: false

    - uses: ./.github/actions/setup-noble-env

    - name: Run Noble - Unit tests
      run: ./.github/scripts/yarf/run-unit-tests.sh

    - name: Upload Coverage Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage
        path: ./coverage_html_report
        retention-days: 5
        overwrite: true

    - if: failure() && runner.debug
      name: Setup upterm session (restart with "Enable debug logging" to activate)
      uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2  # zizmor: ignore[stale-action-refs]
      with:
        limit-access-to-actor: true

  integration-tests-noble:
    name: Noble - Integration tests
    runs-on: ubuntu-24.04
    needs: install-noble
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: true
        persist-credentials: false

    - name: Install the app under test
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gnome-calculator

    - name: Run Noble - Integration tests
      id: yarf
      uses: ./.github/actions/yarf-test
      with:
        platform: Mir
        platform-provider: Mir
        test-path: tests/canary_test
        yarf-args: --output-format TestSubmissionSchema
        yarf-ref: ${{ github.sha }}
        artifact-name: yarf-output-integration

    - name: Validate test submission schema
      env:
        OUTPUT_DIR: ${{ steps.yarf.outputs.output-dir }}
      run: ./.github/scripts/yarf/validate-submission-schema.sh "${OUTPUT_DIR}"

    - if: failure() && runner.debug
      name: Setup upterm session (restart with "Enable debug logging" to activate)
      uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2  # zizmor: ignore[stale-action-refs]
      with:
        limit-access-to-actor: true

  tutorial-tests-noble:
    name: Noble - Tutorial tests (${{ matrix.variant || 'default' }})
    runs-on: ubuntu-24.04
    needs: install-noble
    strategy:
      fail-fast: false
      matrix:
        variant: ["", light]
    env:
      # The suite's own default; an empty value would reach the app as --theme ''.
      SIMPLE_COUNTER_THEME: ${{ matrix.variant || 'dark' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: true
        persist-credentials: false

    - name: Set up the simple counter example
      run: ./.github/scripts/yarf/setup-tutorial-app.sh

    - name: Run Noble - Tutorial tests (${{ matrix.variant || 'default' }})
      uses: ./.github/actions/yarf-test
      with:
        platform: Mir
        platform-provider: Mir
        test-path: examples/yarf-example-simple-counter/yarf_tests
        yarf-args: ${{ matrix.variant && format('--variant {0}', matrix.variant) || '' }}
        yarf-ref: ${{ github.sha }}
        artifact-name: yarf-output-tutorial-${{ matrix.variant || 'default' }}

    - if: failure() && runner.debug
      name: Setup upterm session (restart with "Enable debug logging" to activate)
      uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2  # zizmor: ignore[stale-action-refs]
      with:
        limit-access-to-actor: true

  keyword-tests-noble:
    name: Noble - Keyword tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    needs: install-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: video_image_test
          - suite: video_text_test
          - suite: video_cursor_test
          - suite: video_video_test
          # The HID suites assert on the Wayland trace YARF's stderr produces.
          - suite: hid_keyboard_test
            wayland-debug: client
            yarf-command-suffix: 2> ~/wayland.trace
          - suite: hid_pointer_test
            wayland-debug: client
            yarf-command-suffix: 2> ~/wayland.trace
          - suite: kvm_test
          - suite: llm_client_test
            launch-command: python3 tests/keyword_suite/server/llm_stub_server.py
    env:
      KEYWORDS_LISTENER_PATH: .github/scripts/yarf/keywords_listener.py
      WAYLAND_DEBUG: ${{ matrix.wayland-debug }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: true
        persist-credentials: false

    - name: Install suite dependencies
      run: ./.github/scripts/yarf/install-suite-deps.sh

    - name: Run Noble - Keyword tests (${{ matrix.suite }})
      uses: ./.github/actions/yarf-test
      with:
        platform: Mir
        platform-provider: Mir
        test-path: tests/keyword_suite
        launch-command: ${{ matrix.launch-command }}
        robotframework-args: --suite ${{ matrix.suite }} --listener ${{ env.KEYWORDS_LISTENER_PATH }}
        yarf-command-suffix: ${{ matrix.yarf-command-suffix }}
        yarf-ref: ${{ github.sha }}
        artifact-name: yarf-output-keyword-${{ matrix.suite }}

    - name: Upload per-suite keyword coverage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: keywords-coverage-keyword-${{ matrix.suite }}
        path: keywords_coverage.json
        retention-days: 1
        if-no-files-found: error
        overwrite: true

    - if: failure() && runner.debug
      name: Setup upterm session (restart with "Enable debug logging" to activate)
      uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2  # zizmor: ignore[stale-action-refs]
      with:
        limit-access-to-actor: true

  keyword-coverage-noble:
    name: Noble - Keyword coverage check
    runs-on: ubuntu-latest
    needs: keyword-tests-noble
    if: always()
    env:
      KEYWORDS_COVERAGE_CHECKER: .github/scripts/yarf/check_unused_keywords.py
      COVERAGE_MERGER: .github/scripts/yarf/merge-keywords-coverage.py
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Download per-suite coverage artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: coverage-artifacts
        pattern: keywords-coverage-*

    - name: Merge keyword coverage
      run: python3 ${COVERAGE_MERGER} coverage-artifacts

    - name: Check Keywords coverage
      run: |
        pip install tabulate
        python3 ${KEYWORDS_COVERAGE_CHECKER}
