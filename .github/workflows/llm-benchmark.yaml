name: LLM GUI navigation benchmark

# Runs tests/llm_benchmark against hosted vision models: each model drives an
# Ubuntu 24.04 desktop live session (QEMU/KVM, 1280x800) over VNC. Every
# model gets its own job and VM; the report job merges the results into a
# marimo HTML report and the job summary.
#
# Secrets: OPENROUTER_API_KEY for openrouter:* models, COPILOT_GITHUB_TOKEN
# (a token of a user with a Copilot licence) for copilot:* models,
# GEMINI_API_KEY for gemini:* models.
#
# Pull requests that touch the benchmark run the small "pull_request" model
# set from models.json. Models whose provider has no secret are skipped, e.g.
# all of them for PRs from forks, which do not get this repository's secrets.

on:
  pull_request:
    paths:
      - '.github/workflows/llm-benchmark.yaml'
      - '.github/actions/yarf-test/**'
      - '.github/scripts/llm-benchmark/**'
      - 'tests/llm_benchmark/*'
      - 'yarf/rf_libraries/libraries/llm_client/**'
  workflow_dispatch:
    inputs:
      models:
        description: >-
          Comma separated provider:model entries, e.g.
          "copilot:gpt-5-mini, openrouter:qwen/qwen3.5-9b". Leave empty for
          the defaults in .github/scripts/llm-benchmark/models.json.
        required: false
        default: ""
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read  # Required to check out repository code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ISO_BASE_URL: https://releases.ubuntu.com/noble

jobs:
  select-models:
    name: Select models
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the model matrix
        id: select
        env:
          MODELS: ${{ inputs.models }}
          MODEL_SET: ${{ github.event_name == 'pull_request' && 'pull_request' || 'default' }}
          COPILOT_KEY_SET: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          GEMINI_KEY_SET: ${{ secrets.GEMINI_API_KEY != '' }}
          OPENROUTER_KEY_SET: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: python3 .github/scripts/llm-benchmark/select_models.py

  benchmark:
    name: Benchmark (${{ matrix.model.provider }}:${{ matrix.model.model }})
    needs: select-models
    if: needs.select-models.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        model: ${{ fromJSON(needs.select-models.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the benchmark
        id: yarf
        continue-on-error: true
        uses: ./.github/actions/yarf-test
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VNC_HOST: localhost
          VNC_PORT: "0"
        with:
          platform: Vnc
          platform-provider: custom
          platform-setup-command: ./.github/scripts/llm-benchmark/start-vm.sh
          platform-ready-command: >-
            timeout 60 bash -c
            'until </dev/tcp/localhost/5900; do sleep 1; done'
          platform-teardown-command: pkill -f qemu-system-x86_64 || true
          test-path: tests/llm_benchmark
          yarf-path: .
          yarf-args: --debug
          robotframework-args: >-
            --variable PROVIDER:${{ matrix.model.provider }}
            --variable MODEL:${{ matrix.model.model }}
            --variable ENDPOINT:${{ matrix.model.endpoint }}
            --variable IMAGE_FORMAT:${{ matrix.model.image_format }}
          upload-artifact: "false"

      - name: Check the run
        env:
          EXIT_CODE: ${{ steps.yarf.outputs.exit-code }}
          OUTPUT_DIR: ${{ steps.yarf.outputs.output-dir }}
          MODEL_JSON: ${{ toJSON(matrix.model) }}
        run: |
          # Robot returns the number of failed tests (up to 250); failed
          # tests are benchmark results, anything above is an error. A crash
          # also exits with 1, but leaves no output.xml.
          if [[ -z $EXIT_CODE || $EXIT_CODE -gt 250
                || ! -f $OUTPUT_DIR/output.xml ]]; then
            echo "::error::YARF did not complete (exit code '$EXIT_CODE')"
            exit 1
          fi
          echo "$MODEL_JSON" > "$OUTPUT_DIR/model.json"
          # The suite setup boots the desktop; its failure is not a result.
          if grep -q "Parent suite setup failed" "$OUTPUT_DIR/output.xml"; then
            echo "::error::Suite setup failed, see log.html in the results"
            exit 1
          fi

      - name: Upload results
        if: always() && steps.yarf.outputs.output-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llm-benchmark-run-${{ matrix.model.id }}
          path: ${{ steps.yarf.outputs.output-dir }}
          # Merged into the llm-benchmark artifact by the report job
          retention-days: 1

  report:
    name: Report
    needs: [select-models, benchmark]
    if: >-
      always() && needs.select-models.result == 'success'
      && needs.select-models.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: llm-benchmark-run-*
          path: results

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false

      - name: Build the report
        run: |
          uv run --no-project --with robotframework \
            python .github/scripts/llm-benchmark/benchmark_results.py results
          uv run --no-project --with marimo --with altair \
            --with robotframework \
            marimo export html --no-include-code \
            .github/scripts/llm-benchmark/benchmark_report.py \
            -o llm_benchmark.html -- --results results

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llm-benchmark-report
          path: llm_benchmark.html
          retention-days: 1

      - name: Merge the report and results into one artifact
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llm-benchmark
          pattern: llm-benchmark-*
          separate-directories: true
          delete-merged: true
