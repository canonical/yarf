# Checks the tracked requirements tree on every pull request.
#
# requirements/ holds AGENTS.md and one requirements.md per feature, and
# nothing is tracked under specs/. Spec Kit writes its working files under
# specs/, which .gitignore keeps untracked, so the check fails for a file
# force-added past the ignore rule or a contract that does not follow
# requirements/AGENTS.md. Any tracked path can break the policy, so the
# workflow has no path filter. The tests of the checker run in
# github-scripts.yaml.

name: Requirements policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  requirements:
    name: Validate tracked requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The check uses the standard library only, so nothing is installed.
      - name: Check tracked requirements
        run: python3 .github/scripts/check_requirements.py
