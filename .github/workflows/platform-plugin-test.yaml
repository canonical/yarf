name: Platform plugin test

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # Required to check out repository code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-plugin:
    name: Test platform plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Run plugin integration tests
        uses: ./.github/actions/yarf-test
        with:
          platform: Example
          platform-provider: custom
          python-version: "3.12"
          # The example plugin deliberately omits a yarf dependency, so this
          # installs against the YARF the action already installed.
          platform-setup-command: >-
            python3 -m pip install --break-system-packages
            examples/yarf-example-plugin
          platform-ready-command: yarf --platform Example --help
          platform-teardown-command: >-
            python3 -m pip uninstall --yes yarf-example-plugin
          test-path: tests/plugin_suite
          yarf-ref: ${{ github.sha }}
          artifact-name: yarf-output-plugin

      - if: failure() && runner.debug
        name: Setup upterm session (restart with "Enable debug logging" to activate)
        uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2  # zizmor: ignore[stale-action-refs]
        with:
          limit-access-to-actor: true
