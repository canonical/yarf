name: Canary test

on:
  workflow_call:
    inputs:
      TRACK:
        description: "YARF track to promote within (e.g., latest)"
        type: string
        required: true
      CHANNEL:
        description: "YARF channel to promote from (e.g., stable, candidate, beta, edge)"
        type: string
        required: true
      VER:
        description: "The version of YARF"
        type: string
        required: true
      ARCH:
        description: "The architecture of the snap to promote (e.g., amd64, arm64)"
        type: string
        required: true
      RUNNER:
        description: "The type of machine to run the canary test on"
        type: string
        required: true

    outputs:
      passed:
        description: "Whether all matrix canary tests passed"
        value: ${{ jobs.summarize.outputs.passed }}

# Read-only access to repository contents for checking out code and uploading test results
permissions:
  contents: read
  actions: read # Required to read workflow run data

concurrency:
  group: canary-test-${{ github.ref }}-${{ inputs.TRACK }}-${{ inputs.CHANNEL }}-${{ inputs.ARCH }}
  cancel-in-progress: true

jobs:
  canary-test:
    name: ${{ matrix.platform }} - Canary test yarf snap at channel ${{ inputs.TRACK }}/${{ inputs.CHANNEL }}
    runs-on: ${{ inputs.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Vnc, Mir]

    env:
      TEST_SUITE_PATH: tests
      WAYLAND_DISPLAY: wayland-99

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up canary test environment
        uses: $/.github/actions/setup-canary-env
        with:
          track: ${{ inputs.TRACK }}
          channel: ${{ inputs.CHANNEL }}
          platform: ${{ matrix.platform }}

      - name: Run canary test
        id: test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dbus-run-session -- gnome-calculator &
          snap run yarf --platform="${PLATFORM}" --output-format=TestSubmissionSchema "${TEST_SUITE_PATH}/canary_test"

      - name: Download test submission schema and validate
        run: |
          version=$(jq -r '.version' ~/snap/yarf/common/yarf-outdir/TestSubmissionSchema_output.json)
          check-jsonschema --schemafile https://raw.githubusercontent.com/canonical/test-submission-schema/refs/heads/main/test_submission_schema/schemas/v${version}.json ~/snap/yarf/common/yarf-outdir/TestSubmissionSchema_output.json

      - if: failure()
        name: Collect test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarf-canary-output-${{ matrix.platform }}-${{ inputs.ARCH }}
          path: ~/snap/yarf/common/yarf-outdir/*
          retention-days: 5

      - if: failure() && runner.debug
        name: Setup upterm session (restart with "Enable debug logging" to activate)
        uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2 # zizmor: ignore[stale-action-refs]
        with:
          limit-access-to-actor: true

  plugin-test:
    name: Plugin tests - yarf snap at channel ${{ inputs.TRACK }}/${{ inputs.CHANNEL }}
    runs-on: ${{ inputs.RUNNER }}

    env:
      TEST_SUITE_PATH: tests
      EXAMPLE_PATH: examples
      GITHUB_WORKFLOWS: .github

    steps:
      - name: Check out tests, examples and github workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            ${{ env.TEST_SUITE_PATH }}
            ${{ env.EXAMPLE_PATH }}
            ${{ env.GITHUB_WORKFLOWS }}
          sparse-checkout-cone-mode: false

      - name: Install YARF from channel
        shell: bash
        env:
          TRACK: ${{ inputs.TRACK }}
          CHANNEL: ${{ inputs.CHANNEL }}
        run: |
          set -euo pipefail
          bash .github/scripts/canary-test/snap-install.sh yarf --channel="${TRACK}/${CHANNEL}"

      - name: Pin YARF to the requested version in yarf-example-plugin pyproject.toml
        run: bash .github/scripts/canary-test/pin-yarf-version.sh

      - name: Build yarf-example-plugin snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          path: examples/yarf-example-plugin

      - name: Install yarf-example-plugin snap
        shell: bash
        run: |
          set -euo pipefail
          sudo snap install examples/yarf-example-plugin/*.snap --dangerous

      - name: Connect platform plugin interface
        run: |
          sudo snap connect yarf-example-plugin:platform-plugins yarf:platform-plugins

      - name: Run plugin tests
        run: |
          snap run yarf --platform Example "${TEST_SUITE_PATH}/plugin_suite"

      - if: failure()
        name: Collect test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarf-canary-output-plugin-${{ inputs.ARCH }}
          path: ~/snap/yarf/common/yarf-outdir/*
          retention-days: 5

  keyword-tests:
    name: Mir - Keyword tests (${{ matrix.suite }}) - yarf snap at channel ${{ inputs.TRACK }}/${{ inputs.CHANNEL }}
    runs-on: ${{ inputs.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        # The snap is strictly confined and cannot start the apps under test,
        # so each suite's app is launched from the workflow instead.
        include:
          - suite: video_image_test
            launch-command: dbus-run-session -- gnome-calculator
          - suite: video_text_test
            launch-command: dbus-run-session -- eog -f tests/keyword_suite/text/text.png
          - suite: video_cursor_test
          - suite: video_video_test
            setup-command: >-
              mkdir -p tests/keyword_suite/videos &&
              ffmpeg -f lavfi -i testsrc=duration=30:size=1280x720:rate=30
              -c:v libx264 tests/keyword_suite/videos/video.mp4
            # Shared-memory output keeps the video visible to Mir screencopy.
            launch-command: dbus-run-session -- mpv --fs --vo=wlshm tests/keyword_suite/videos/video.mp4
          - suite: grid_test
            setup-command: bash .github/scripts/canary-test/setup-grid-app.sh "${RUNNER_TEMP}/grid-venv"
            launch-command: >-
              UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/grid-venv"
              dbus-run-session -- uv --project tests/keyword_suite/grid run grid-app --contrast 0.85
          - suite: grid_test_low_contrast
            robot-suite: grid_test
            robot-args: --variable COLOR_TOLERANCE:10
            setup-command: bash .github/scripts/canary-test/setup-grid-app.sh "${RUNNER_TEMP}/grid-venv"
            launch-command: >-
              UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/grid-venv"
              dbus-run-session -- uv --project tests/keyword_suite/grid run grid-app --contrast 0.55
          # The snap writes the Wayland trace only after it exits and cannot
          # read ~/wayland.trace, so each HID test runs with the snap and its
          # assertion runs from source afterwards.
          - suite: hid_keyboard_test
            hid-tests: |
              Test Keyword Type String Numbers
              Test Keyword Type String Alphabets
              Test Keyword Type String With Shift Key Symbols
              Test Keyword Type String With Shift Key Capital Letters
              Test Keys Combo Numbers
              Test Keys Combo Alphabets
              Test Keys Combo Function
          - suite: hid_pointer_test
            hid-tests: |
              Test Button Press Actions
              Test Keyword Type String Alphabets
              Test Keyword Type String With Shift Key Symbols
              Test Keyword Type String With Shift Key Capital Letters
              Test Keys Combo Numbers
              Test Keys Combo Alphabets
              Test Keys Combo Function
              Test Keys Combo Function
          - suite: kvm_test
            launch-command: dbus-run-session -- gnome-calculator
          - suite: llm_client_test
            launch-command: python3 tests/keyword_suite/server/llm_stub_server.py

    env:
      TEST_SUITE_PATH: tests
      WAYLAND_DISPLAY: wayland-99

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up canary test environment
        uses: $/.github/actions/setup-canary-env
        with:
          track: ${{ inputs.TRACK }}
          channel: ${{ inputs.CHANNEL }}
          platform: Mir

      - if: matrix.hid-tests
        name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The HID assertions run YARF from source, which builds pywayland from
      # source where no wheel exists (arm64).
      - if: matrix.hid-tests
        name: Install build dependencies for YARF from source
        run: |
          sudo apt-get --yes --no-install-recommends install \
            libwayland-dev \
            wayland-protocols

      - name: Run Keyword tests - ${{ matrix.suite }}
        shell: bash
        env:
          ROBOT_SUITE: ${{ matrix.robot-suite || matrix.suite }}
          ROBOT_ARGS: ${{ matrix.robot-args }}
          SETUP_COMMAND: ${{ matrix.setup-command }}
          LAUNCH_COMMAND: ${{ matrix.launch-command }}
          HID_TESTS: ${{ matrix.hid-tests }}
        run: |
          set -euo pipefail

          if [[ -n "${SETUP_COMMAND}" ]]; then
            bash -c "${SETUP_COMMAND}"
          fi
          if [[ -n "${LAUNCH_COMMAND}" ]]; then
            bash -c "${LAUNCH_COMMAND}" &
          fi

          if [[ -n "${HID_TESTS}" ]]; then
            export WAYLAND_DEBUG=client
            while IFS= read -r hid_test; do
              [[ -z "${hid_test}" ]] && continue
              snap run yarf --platform Mir "${TEST_SUITE_PATH}/keyword_suite/" -- --test "${hid_test}" 2> ~/wayland.trace
              uv run yarf --platform Mir "${TEST_SUITE_PATH}/keyword_suite/" -- --test "Assert ${hid_test}"
            done <<< "${HID_TESTS}"
          else
            read -r -a robot_args <<< "${ROBOT_ARGS}"
            snap run yarf --platform Mir "${TEST_SUITE_PATH}/keyword_suite" -- --suite "${ROBOT_SUITE}" "${robot_args[@]}"
          fi

      - if: failure()
        name: Collect test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarf-canary-output-keyword-${{ matrix.suite }}-${{ inputs.ARCH }}
          path: ~/snap/yarf/common/yarf-outdir/*
          retention-days: 5

      - if: failure() && runner.debug
        name: Setup upterm session (restart with "Enable debug logging" to activate)
        uses: canonical/action-tmate@a0e8caed3bba2ccb98901a274553bf1284ad96c2 # zizmor: ignore[stale-action-refs]
        with:
          limit-access-to-actor: true

  summarize:
    name: Summarize test results
    needs:
      - canary-test
      - plugin-test
      - keyword-tests
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.set.outputs.passed }}
    steps:
      - id: set
        env:
          CANARY_TEST_RESULT: ${{ needs.canary-test.result }}
          PLUGIN_TEST_RESULT: ${{ needs.plugin-test.result }}
          KEYWORD_TESTS_RESULT: ${{ needs.keyword-tests.result }}
        run: |
          if [[ "${CANARY_TEST_RESULT}" == "success" &&
                "${PLUGIN_TEST_RESULT}" == "success" &&
                "${KEYWORD_TESTS_RESULT}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
