name: Repository Security Scan

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to check out repository code
      packages: read  # Fetch the reposcan tool image from GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Secrets scan inspects the full git history
          persist-credentials: false

      - name: Scan
        uses: canonical/reposcan@760e06d3db4a95bba2697fd586aa815975682428  # v0.2.1
        with:
          code-scanning: false
          sbom: true
          # Report-only until the findings already on main are fixed
          fail-on: none
