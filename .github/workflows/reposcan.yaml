name: Repository Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to check out repository code
      security-events: write  # Upload SARIF to the code-scanning pane
      pull-requests: write  # Comment scan results on the pull request
      packages: read  # Fetch the reposcan tool image from GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan
        uses: canonical/reposcan@760e06d3db4a95bba2697fd586aa815975682428  # v0.2.1
        with:
          pr-comment: ${{ github.event_name == 'pull_request' }}
          image: ${{ github.event_name == 'pull_request' && 'build' || 'canonical' }}
          sbom: ${{ github.ref == 'refs/heads/main' }}
