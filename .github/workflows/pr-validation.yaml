name: PR Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited

permissions:
  contents: read  # Required to check out repository code

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate_title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Required to update PR title if needed
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Checking the presence of the traceability tag in the PR title
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: .github/scripts/pr-validation/validate-pr-title.sh

  validate_body:
    name: Validate PR description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Required to strip leftover template comments
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Checking that the PR template sections are filled in
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: python3 .github/scripts/pr-validation/validate_pr_body.py
