name: Test YARF action

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths:
      - '.github/actions/yarf-test/**'
      - '.github/workflows/test-yarf-action.yaml'
  workflow_dispatch:

permissions:
  contents: read  # Required to check out repository code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-action:
    name: ${{ matrix.platform }} - Run YARF via the action
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Mir, Vnc]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install the app under test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-calculator

      - name: Run canary test through the action
        id: yarf
        uses: ./.github/actions/yarf-test
        with:
          platform: ${{ matrix.platform }}
          platform-provider: ${{ matrix.platform }}
          test-path: tests/canary_test
          yarf-ref: ${{ github.sha }}
          artifact-name: yarf-output-${{ matrix.platform }}

      - name: Check action outputs
        env:
          RESULT: ${{ steps.yarf.outputs.result }}
          OUTPUT_DIR: ${{ steps.yarf.outputs.output-dir }}
        run: |
          set -euo pipefail
          echo "result=${RESULT}"
          echo "output-dir=${OUTPUT_DIR}"
          test "${RESULT}" = "passed"

  test-action-custom-platform:
    name: Example - Run YARF via the action with a custom platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Run plugin test through the action
        id: yarf
        uses: ./.github/actions/yarf-test
        with:
          platform: Example
          platform-provider: custom
          python-version: "3.12"
          platform-setup-command: >-
            python3 -m pip install --break-system-packages
            examples/yarf-example-plugin
          # Fails unless YARF discovered the plugin, so a broken install is
          # reported before the suite runs.
          platform-ready-command: yarf --platform Example --help
          platform-teardown-command: >-
            python3 -m pip uninstall --yes yarf-example-plugin
          test-path: tests/plugin_suite
          yarf-ref: ${{ github.sha }}
          artifact-name: yarf-output-Example

      - name: Check action outputs
        env:
          RESULT: ${{ steps.yarf.outputs.result }}
          OUTPUT_DIR: ${{ steps.yarf.outputs.output-dir }}
        run: |
          set -euo pipefail
          echo "result=${RESULT}"
          echo "output-dir=${OUTPUT_DIR}"
          test "${RESULT}" = "passed"
