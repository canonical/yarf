schema_version: "1.0"
workflow:
  id: "speckit"
  name: "YARF Feature Planning"
  version: "1.1.0"
  author: "GitHub"
  description: "Runs specify → clarify → plan → tasks with review gates and stops before implementation"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The commands below (specify, clarify, plan, tasks) are available in
    # the initialized Spec Kit integration. The list here is an advisory,
    # non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema. The workflow runs against any initialized
    # integration that provides the commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"
      - "pi"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. copilot, opencode, pi; 'auto' uses the project's initialized integration)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the clarified specification before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review and approve the task list before implementation begins outside this workflow."
    options: [approve, reject]
    on_reject: abort
