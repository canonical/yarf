name: yarf
base: core26
adopt-info: yarf
title: YARF
summary: Yet Another Robot Framework
description: |
  Yet Another Robot Framework (YARF) is an interface that
  allows developers to build complex test scenarios and
  bootstrap them locally, then work towards automated runs.
license: GPL-3.0
website: https://canonical-yarf.readthedocs-hosted.com/
source-code: https://github.com/canonical/yarf
issues: https://github.com/canonical/yarf/issues
contact: https://github.com/canonical/yarf/issues

grade: stable
confinement: strict

slots:
  platform-plugins:
    interface: content
    write:
      - $SNAP_COMMON/platform_plugins

layout:
  /usr/share/tesseract-ocr:
    bind: $SNAP/usr/share/tesseract-ocr
  /usr/share/ffmpeg:
    bind: $SNAP/usr/share/ffmpeg
  /usr/lib/python3.14/tkinter:
    bind: $SNAP/usr/lib/python3.14/tkinter
  /usr/lib/python3.14/lib-dynload/_tkinter.cpython-314-$CRAFT_ARCH_TRIPLET_BUILD_FOR.so:
    symlink: $SNAP/usr/lib/python3.14/lib-dynload/_tkinter.cpython-314-$CRAFT_ARCH_TRIPLET_BUILD_FOR.so
  /usr/lib/tcltk:
    symlink: $SNAP/gnome-platform/usr/lib/tcltk
  /usr/share/tcltk:
    symlink: $SNAP/gnome-platform/usr/share/tcltk

parts:
  scripts:
    plugin: dump
    source: scripts

  yarf:
    plugin: python
    source: .
    stage-packages:
      - ffmpeg
      - libblas3
      - liblapack3
      - tesseract-ocr
      - python3-tk
      - xclip
    override-pull: |
      craftctl default

      version=$(grep -Po 'version = "\K[^"]*' pyproject.toml)
      craftctl set version=$version

    override-build: |
      craftctl default

      # python3-tk stages the base pip metadata too. Retain only the metadata
      # that matches the pip code installed in YARF's virtual environment.
      site_packages="${CRAFT_PART_INSTALL}/lib/python3.14/site-packages"
      pip_version=$(grep -Po '^__version__ = "\K[^"]+' \
        "${site_packages}/pip/__init__.py")
      find "${site_packages}" -maxdepth 1 -type d -name 'pip-*.dist-info' \
        ! -name "pip-${pip_version}.dist-info" -print -exec rm -rf {} +

    build-environment:
      - C_INCLUDE_PATH: /snap/gnome-core26-sdk/current/usr/include:${C_INCLUDE_PATH:-}

    organize:
      usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/blas/*: usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
      usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/lapack/*: usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}

    prime:
      - -etc/X11
      - -etc/fonts
      - -usr/share/drirc.d
      - -usr/share/X11
      - -usr/share/lintian
      - -usr/share/man

  cleanup:
    after: [ yarf ]
    plugin: nil
    build-snaps: [core26, mesa-2604, gnome-core26 ]
    override-prime: |
      set -eux

      # Go through the pre-requisite snaps of this snap and drop the relevant
      # duplicate files, in particular:
      #  - All the libraries (any so-version) that we ship in content snaps
      #  - All the "usr" files that are already part of the content snaps
      for snap in "core26" "mesa-2604" "gnome-core26"; do
        cd "/snap/$snap/current"
        find . -type f,l -name *.so.* -exec sh -c 'rm -fv "$CRAFT_PRIME/{}"*' \;
        if [ -d usr ]; then
          find usr -type f,l -exec rm -fv "$CRAFT_PRIME/{}" \;
        fi
      done

      find "$CRAFT_PRIME" -type d -empty -delete

      sed -i -e "s|/snap/gnome-core26-sdk/current||g" ${CRAFT_PRIME}/pyvenv.cfg
      sed -i -E "s|/snap/gnome-core26-sdk/[0-9]+||g" ${CRAFT_PRIME}/pyvenv.cfg

apps:
  yarf:
    extensions:
      - gnome
    command-chain:
      - bin/wayland-launch
    command: bin/yarf
    plugs:
      - home
      - network
      - process-control
